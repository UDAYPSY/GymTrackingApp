name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  build-and-test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Configure Android Platform Files
        run: |
          mkdir -p /tmp/res_backup
          cp -r android/app/src/main/res/* /tmp/res_backup/ || true
          cp android/app/src/main/AndroidManifest.xml /tmp/res_backup/AndroidManifest.xml || true
          rm -rf android
          flutter create --platforms=android --project-name=gym_manager --org=com.gymhelper .
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          cp -r /tmp/res_backup/* android/app/src/main/res/ || true
          cp /tmp/res_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          FLUTTER_SDK_DIR="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK_DIR" > android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          cat android/local.properties
          chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Android Debug APK
        run: |
          if ! flutter build apk --debug --verbose > build.log 2>&1; then
            echo "=== LAST 50 LINES OF BUILD LOG ==="
            tail -n 50 build.log
            while IFS= read -r line; do
              clean_line=$(echo "$line" | tr -d '\r')
              [ -n "$clean_line" ] && echo "::error title=BuildFailure::$clean_line"
            done < <(tail -n 20 build.log)
            exit 1
          fi

      - name: Locate Generated APK
        run: |
          echo "Searching for generated APKs..."
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracking-app-debug-apk
          path: "**/outputs/**/*.apk"
          if-no-files-found: error

name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  build-and-test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Configure Android local.properties
        run: |
          FLUTTER_SDK_DIR="$(dirname "$(dirname "$(which flutter)")")"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK_DIR" >> android/local.properties
          echo "flutter.minSdkVersion=23" >> android/local.properties
          cat android/local.properties
          chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Flutter Bundle
        run: |
          if ! flutter build bundle -v > bundle.log 2>&1; then
            echo "=== BUNDLE CRASH LOG ==="
            cat flutter_*.log || true
            while IFS= read -r line; do
              clean_line=$(echo "$line" | tr -d '\r')
              [ -n "$clean_line" ] && echo "::error title=CrashReport::$clean_line"
            done < <(cat flutter_*.log | head -n 12)
            while IFS= read -r line; do
              clean_line=$(echo "$line" | tr -d '\r')
              [ -n "$clean_line" ] && echo "::error title=TopFrame::$clean_line"
            done < <(grep -E -B 4 -A 4 "#0" bundle.log | head -n 10)
            exit 1
          fi

      - name: Build Android Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation -v

      - name: Locate Generated APK
        run: |
          echo "Searching for generated APKs..."
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracking-app-debug-apk
          path: "**/outputs/**/*.apk"
          if-no-files-found: error

name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  build-and-test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Recreate Clean Canonical Android Platform Files
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml || true
          rm -rf android
          flutter create --platforms=android --project-name=gym_manager --org=com.gymhelper .
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos || true

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Flutter Bundle
        run: flutter build bundle -v

      - name: Build Android Debug APK
        run: |
          if ! flutter build apk --debug --android-skip-build-dependency-validation --verbose > build.log 2>&1; then
            echo "=== GRADLE FAILURE DIAGNOSTIC ==="
            grep -B 25 "Execution failed for task ':app:compileFlutterBuildDebug'" build.log | while IFS= read -r line; do
              clean_line=$(echo "$line" | tr -d '\r')
              [ -n "$clean_line" ] && echo "::error title=Compiler::$clean_line"
            done
            grep -A 6 "What went wrong" build.log | while IFS= read -r line; do
              clean_line=$(echo "$line" | tr -d '\r')
              [ -n "$clean_line" ] && echo "::error title=GradleRootCause::$clean_line"
            done
            exit 1
          fi

      - name: Locate Generated APK
        run: |
          echo "Searching for generated APKs..."
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracking-app-debug-apk
          path: "**/outputs/**/*.apk"
          if-no-files-found: error

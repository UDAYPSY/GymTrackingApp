name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  build-and-test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew || true

      - name: Run Unit & Widget Tests
        run: flutter test --reporter expanded 2>&1 | tee test.log
        continue-on-error: true

      - name: Build Android Debug APK
        run: flutter build apk --debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Publish Step Summary
        if: always()
        run: |
          echo "### Test Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 test.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracking-app-debug-apk
          path: build/app/outputs/**/*.apk
          if-no-files-found: warn

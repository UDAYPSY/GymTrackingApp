name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  build-and-test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Configure Android local.properties
        run: |
          FLUTTER_SDK_DIR="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK_DIR" > android/local.properties
          cat android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew || true

      - name: Run Unit & Widget Tests
        run: flutter test --reporter expanded

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracking-app-debug-apk
          path: build/app/outputs/**/*.apk

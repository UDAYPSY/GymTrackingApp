name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  build-and-test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Configure Android local.properties
        run: |
          FLUTTER_SDK_DIR="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK_DIR" > android/local.properties
          cat android/local.properties

      - name: Ensure Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew
          ls -la android/gradle/wrapper/

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos || true

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Android Debug APK
        run: |
          if ! flutter build apk --debug --verbose > build.log 2>&1; then
            echo "=== BUILD LOG TAIL ==="
            tail -n 50 build.log
            while IFS= read -r line; do
              # Clean line for annotation
              clean_line=$(echo "$line" | tr -d '\r')
              if [ -n "$clean_line" ]; then
                echo "::error title=Gradle Error::$clean_line"
              fi
            done < <(tail -n 25 build.log)
            exit 1
          fi

      - name: Locate Generated APK
        run: |
          echo "Searching for generated APKs..."
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracking-app-debug-apk
          path: "**/outputs/**/*.apk"
          if-no-files-found: error

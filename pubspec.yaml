name: gym_manager
description: "Offline-First Gym Management & Member Tracking Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase Suite (Offline-first Cloud Firestore, Auth & Storage)
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  firebase_storage: ^12.0.1

  # UI, Icons & Theming
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Utilities & Helpers
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0

  # QR Code Attendance
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Invoicing & PDF Generation
  pdf: ^3.10.8
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
